name: Add or replace a company icon
description: Submit an icon for a company already represented in Sourcey.
title: "Company icon: "
body:
  - type: markdown
    attributes:
      value: |
        This issue is an intake surface, not asset storage or publication authority. Sourcey retains the exact submitted bytes, performs a deterministic safe transform, and publishes the reviewed icon through the Catalog asset lane. For authenticated upload and status tracking, use https://sourcey.com/submit/company-icon.
  - type: input
    id: company
    attributes:
      label: Company
      description: Use the current Sourcey company name or canonical company URL.
      placeholder: Acme or https://sourcey.com/catalog/acme
    validations:
      required: true
  - type: input
    id: official_source
    attributes:
      label: Exact official icon URL
      description: Prefer an HTTPS URL declared by the company's official website. You may attach the original image to this issue instead.
      placeholder: https://example.com/icon.png
  - type: textarea
    id: rights
    attributes:
      label: Publication and trademark basis
      description: State your relationship to the company and why Sourcey may display this mark.
    validations:
      required: true
  - type: checkboxes
    id: declarations
    attributes:
      label: Declarations
      options:
        - label: I have not embedded the icon URL or image bytes in company YAML.
          required: true
        - label: I understand that review and Catalog admission, not this issue body, determine the published icon.
          required: true
