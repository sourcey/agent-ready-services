name: Report outdated evidence or request a rerun
description: Point to one report card step that may no longer match the service.
title: "Evidence review: "
labels:
  - evidence-review
body:
  - type: input
    id: report_card
    attributes:
      label: Sourcey report card URL
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Step
      options:
        - Discover
        - Delegation
        - Pay
        - Job
        - Confirm
        - Sustain
        - Onboard level
    validations:
      required: true
  - type: textarea
    id: changed
    attributes:
      label: What changed
      description: Explain what the service does now, and why the card may be out of date or a rerun would help.
    validations:
      required: true
  - type: textarea
    id: public_sources
    attributes:
      label: Public supporting URLs
      description: Current public URLs only. Do not include keys, tokens, personal data or captures from a signed-in session.
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: Your relationship
      options:
        - Community reporter or customer
        - Employee or authorized representative of the company
        - Sourcey maintainer
    validations:
      required: true
