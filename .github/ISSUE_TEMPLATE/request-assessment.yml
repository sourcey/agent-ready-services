name: Request an assessment
description: Propose one exact Entity, service, product, and funnel for independent Agent Readiness assessment.
title: "Assessment request: "
labels:
  - assessment-request
body:
  - type: markdown
    attributes:
      value: |
        A request is not a readiness claim. Do not include credentials, personal data, private captures, or unpublished material.
  - type: input
    id: entity
    attributes:
      label: Entity
      description: The public party responsible for the service or product.
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: Product or service
      description: The exact product, API, platform, or externally obtainable service.
    validations:
      required: true
  - type: input
    id: funnel
    attributes:
      label: Funnel
      description: The exact service-access or operating journey to assess, such as API resource management or workspace integration.
    validations:
      required: true
  - type: textarea
    id: useful_action
    attributes:
      label: Essential useful action
      description: Name the real outcome an authorized agent should be able to complete, such as create and recover a database or send and inspect a message.
    validations:
      required: true
  - type: textarea
    id: discovery_terms_pricing
    attributes:
      label: Discovery, terms, eligibility, and pricing
      description: Public HTTPS URLs an agent can use to find the service and decide applicable commitment, access conditions, and cost.
    validations:
      required: true
  - type: textarea
    id: access_authentication
    attributes:
      label: Access and Authentication
      description: Public signup, authorization, token, API-key, credential lifecycle, delegated identity, CAPTCHA, phone, or other access-boundary URLs and notes.
  - type: textarea
    id: payment
    attributes:
      label: Payment
      description: Public pricing, checkout, billing API, payment-protocol, or explicit no-charge material when payment is part of this service funnel.
  - type: textarea
    id: provisioning
    attributes:
      label: Provisioning
      description: Public create, activate, completion-status, credential-delivery, or bounded-delay resources and endpoints.
  - type: textarea
    id: operation_recovery
    attributes:
      label: Operation, errors, and recovery
      description: Public service interfaces, API or tool endpoints, inputs and outputs, limits, errors, retries, idempotency, reconciliation, and recovery material.
    validations:
      required: true
  - type: textarea
    id: published_standards
    attributes:
      label: Published standards
      description: Exact standard names, versions, requirement documents, and implementation descriptors such as OpenAPI, MCP, A2A, OAuth or OIDC, Web Bot Auth, ACP, UCP, AP2, or x402. Leave blank when none is declared.
  - type: input
    id: sourcey_record
    attributes:
      label: Existing Sourcey Entity or Offer URL
      description: Include it when this Entity or an exact related Offer already appears in Sourcey.
  - type: dropdown
    id: relationship
    attributes:
      label: Your relationship
      options:
        - Community contributor or customer
        - Employee or authorized representative of the Entity
        - Sourcey maintainer
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this funnel should be assessed
    validations:
      required: true
  - type: checkboxes
    id: public_only
    attributes:
      label: Safety
      options:
        - label: I included only public, non-sensitive material.
          required: true
