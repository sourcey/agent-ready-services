name: Request a listing
description: Ask Sourcey to list one product and the job an agent should be able to do with it.
title: "Listing request: "
labels:
  - assessment-request
body:
  - type: markdown
    attributes:
      value: |
        A request is not a readiness claim. Do not include keys, tokens, personal data, captures from a signed-in session or unpublished material.
  - type: input
    id: entity
    attributes:
      label: Company
      description: The public company or organization responsible for the product.
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: Product
      description: The exact product, API, platform or service an agent would use.
    validations:
      required: true
  - type: dropdown
    id: job
    attributes:
      label: Job
      description: The job from Sourcey's job library for this kind of service. Choose "None of these fit" if no job matches.
      options:
        - bounty-claim (Claim a bounty)
        - bucket-create (Create a storage bucket)
        - chat-message-post (Post a message)
        - crm-contact-create (Create a contact)
        - database-create (Create a database deployment)
        - deployment-create (Create a deployment)
        - dns-resolve (Resolve a name)
        - email-send (Send an email)
        - error-event-report (Report an error)
        - feature-flag-create (Create a feature flag)
        - model-chat-stream-tool (Stream a completion with a tool call)
        - monitor-create (Create a monitor)
        - payment-create (Create a payment link)
        - repository-create (Create a repository)
        - search-record-find (Find a record by search)
        - sms-send (Send a text message)
        - user-create (Create a user)
        - vector-upsert-query (Find a vector by query)
        - workspace-page-create (Create a page)
        - None of these fit
    validations:
      required: true
  - type: textarea
    id: documentation
    attributes:
      label: Documentation, terms and pricing
      description: Public HTTPS URLs that describe the product, its terms and what it costs.
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: How an agent does the job
      description: Public URLs for the API reference, MCP server, CLI or other interface an agent would use, and the endpoint it calls if one is published.
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Sign-up, keys and payment
      description: Public URLs for signing up, getting a key or login, OAuth, payment or billing, if the job needs them.
  - type: textarea
    id: published_standards
    attributes:
      label: Published standards
      description: Exact standards and versions the service publishes, such as OpenAPI, MCP, OAuth, OpenID Connect or x402. Leave blank when none is declared.
  - type: input
    id: sourcey_record
    attributes:
      label: Existing Sourcey record
      description: The company's Sourcey URL, if it already has one.
  - type: dropdown
    id: relationship
    attributes:
      label: Your relationship
      options:
        - Community contributor or customer
        - Employee or authorized representative of the company
        - Sourcey maintainer
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why list this service
    validations:
      required: true
  - type: checkboxes
    id: public_only
    attributes:
      label: Safety
      options:
        - label: I included only public, non-sensitive material.
          required: true
