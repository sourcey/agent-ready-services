name: Request a listing
description: Ask Sourcey to list one product and the job an agent should be able to do with it.
title: "Listing request: "
labels:
  - assessment-request
body:
  - type: markdown
    attributes:
      value: |
        The quickest way to list a service is to add it yourself at https://sourcey.com/submit?type=agent-readiness, or with a pull request following [CONTRIBUTING.md](https://github.com/sourcey/agent-ready-services/blob/main/CONTRIBUTING.md). Use this form when you'd rather Sourcey add it.

        A request is not a readiness claim. Do not include keys, tokens, personal data, captures from a signed-in session or unpublished material.
  - type: input
    id: entity
    attributes:
      label: Company
      description: The public company or organization responsible for the product.
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: Product
      description: The exact product, API, platform or service an agent would use.
    validations:
      required: true
  - type: input
    id: job
    attributes:
      label: Job
      description: The job's key from the job library in CONTRIBUTING.md, such as `email-send`. If none fits, write "No matching job".
    validations:
      required: true
  - type: textarea
    id: documentation
    attributes:
      label: Documentation, terms and pricing
      description: Public HTTPS URLs that describe the product, its terms and what it costs.
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: How an agent does the job
      description: Public URLs for the API reference, OpenAPI document, MCP server (and the tool that does the job), CLI or other interface an agent would use, the endpoint it calls if one is published, and the documented request that does the job.
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Sign-up, keys and payment
      description: Public URLs for signing up, getting a key or login, OAuth, payment or billing, or asking sales for access, if the job needs them.
  - type: textarea
    id: published_standards
    attributes:
      label: Published standards
      description: Exact standards and versions the service publishes, such as OpenAPI, MCP, OAuth, OpenID Connect or x402. Leave blank when none is declared.
  - type: input
    id: sourcey_record
    attributes:
      label: Existing Sourcey record
      description: The company's Sourcey URL, if it already has one.
  - type: dropdown
    id: relationship
    attributes:
      label: Your relationship
      options:
        - Community contributor or customer
        - Employee or authorized representative of the company
        - Sourcey maintainer
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why list this service
    validations:
      required: true
  - type: checkboxes
    id: public_only
    attributes:
      label: Safety
      options:
        - label: I included only public, non-sensitive material.
          required: true
